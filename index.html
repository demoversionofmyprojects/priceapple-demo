<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Price Apple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" href="models/airpods-max-2.glb" as="fetch" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
:root{
  --bg:#ffffff; --soft:#f5f5f7; --line:rgba(0,0,0,.07); --ink:#1d1d1f; --muted:#86868b;
  --ease:cubic-bezier(.2,.8,.2,1);
  --box-shadow:0 0 0 1px rgba(0,0,0,.055),0 1px 0 rgba(0,0,0,.04),0 2px 0 #f1f1f3,0 3px 0 rgba(0,0,0,.05),0 10px 18px -10px rgba(0,0,0,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 -apple-system,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3{font-family:-apple-system,"SF Pro Display","Inter",system-ui,sans-serif;letter-spacing:-.025em;margin:0}

/* ---------- hero ---------- */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 20px 28px;position:relative;
  background:radial-gradient(120% 70% at 50% 38%,#fff 0%,#f6f6f8 60%,#efeff2 100%)}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:600;font-size:17px;letter-spacing:-.02em;display:flex;gap:7px;align-items:center}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px var(--line);position:relative}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.badge:empty{display:none}
.stage{position:relative;width:100%;max-width:520px;flex:1;min-height:300px;max-height:56svh}
#hero3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.stage::after{content:"";position:absolute;left:22%;right:22%;bottom:4%;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.18),transparent);filter:blur(4px);z-index:-1}
.hero-copy{text-align:center;animation:rise .9s var(--ease) both .2s}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.01em}
.hero h1{font-size:clamp(38px,11vw,64px);font-weight:700;line-height:1.02;margin:6px 0 10px}
.hero p{margin:0 auto;color:var(--muted);font-size:17px;max-width:300px}
.cta{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.btn-primary{background:var(--ink);color:#fff;height:50px;padding:0 30px;border-radius:25px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease),opacity .2s}
.btn-primary:active{transform:scale(.96)}
.arrow{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* ---------- "Apple box" controls ---------- */
.catalog{padding:30px 16px 120px;max-width:720px;margin:0 auto}
.catalog h2{font-size:30px;font-weight:700;margin-bottom:16px}
.box{position:relative;background:linear-gradient(#fff,#fafafb);border-radius:14px;box-shadow:var(--box-shadow)}
.box::before{content:"";position:absolute;left:0;right:0;top:30%;height:1px;background:rgba(0,0,0,.05);pointer-events:none} /* lid seam */
.search{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;margin-bottom:14px}
.search::before{top:11px}
.search::after{content:"";position:absolute;right:16px;bottom:-1px;width:34px;height:7px;border-radius:4px 4px 0 0;background:#ececef;box-shadow:inset 0 1px 0 rgba(0,0,0,.05)} /* pull tab */
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink);min-width:0}
.search input::placeholder{color:#a1a1a6}
.filters{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 12px;margin:0 -16px 6px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;font-size:14px;font-weight:500;border-radius:11px;white-space:nowrap;transition:background .25s,color .25s,transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:#fff}
.chip.on::before{background:rgba(255,255,255,.14)}
.sortbox{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;color:var(--muted);font-size:14px}
.sortbox label{position:relative;height:34px;padding:0 12px;display:flex;align-items:center;gap:6px;border-radius:10px;color:var(--ink);font-weight:500}
.sortbox label::before{display:none}
.sortbox select{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;color:inherit;outline:0;padding-right:2px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 8px 24px -14px rgba(0,0,0,.18);cursor:pointer;transition:transform .25s var(--ease);animation:rise .6s var(--ease) both}
.card:active{transform:scale(.97)}
.card-img{position:relative;aspect-ratio:1;background:var(--soft);display:grid;place-items:center}
.card-img img{width:100%;height:100%;object-fit:contain}
.like{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line);transition:transform .2s}
.like:active{transform:scale(.85)}
.like svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:1.8;transition:fill .2s,stroke .2s}
.like.on svg{fill:#ff375f;stroke:#ff375f}
.card-body{padding:12px 14px 15px}
.card-name{font-weight:600;font-size:15px;letter-spacing:-.01em}
.card-sub{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin:3px 0 8px}
.sw{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);flex:none}
.card-price{font-weight:600;font-size:16px}
.card-price s{color:var(--muted);font-weight:400;font-size:12px;margin-left:5px}
.credit{margin:28px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.credit a{color:inherit}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* ---------- product sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;transform-origin:0 0;background:#fff;overflow-y:auto;overscroll-behavior:contain}
.sheet[hidden],.cart[hidden],.cartbar[hidden]{display:none}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--soft);scrollbar-width:none;border-radius:0 0 32px 32px}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;width:100%;aspect-ratio:1;max-height:62svh;object-fit:contain;scroll-snap-align:center}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-26px;position:relative;height:14px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.2);transition:width .3s var(--ease),background .3s}
.dots i.on{width:18px;background:var(--ink)}
.close{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:2}
.sheet-body{padding:26px 20px 130px;max-width:720px;margin:0 auto}
.sheet-body h2{font-size:30px;font-weight:700;margin:4px 0 8px}
.d-price{font-size:24px;font-weight:600;margin-bottom:18px}
.d-price s{font-size:15px;color:var(--muted);font-weight:400;margin-left:8px}
.colors{display:flex;gap:10px;margin-bottom:6px}
.colors button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);outline:2px solid transparent;outline-offset:3px;transition:outline-color .2s}
.colors button.on{outline-color:var(--ink)}
.color-name{color:var(--muted);font-size:14px;margin-bottom:18px}
.sheet-body p{color:#424245;font-size:16px;line-height:1.5;margin:0 0 20px}
.specs{list-style:none;margin:0;padding:0;border-radius:18px;background:var(--soft)}
.specs li{padding:14px 16px;display:flex;gap:10px;font-size:15px}
.specs li+li{border-top:1px solid var(--line)}
.specs li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);margin-top:8px;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.bar .like{position:static;width:50px;height:50px;flex:none}
.bar .like svg{width:22px;height:22px}
.bar .btn-primary{flex:1;justify-content:center}

/* ---------- cart ---------- */
.cartbar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;height:56px;border-radius:28px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:600;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);animation:rise .4s var(--ease)}
.cart{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;animation:fade .25s}
.cart-panel{width:100%;max-height:85svh;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .4s var(--ease)}
.grab{width:38px;height:5px;border-radius:3px;background:#d2d2d7;margin:0 auto 14px}
.cart h3{font-size:24px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row img{width:62px;height:62px;border-radius:14px;background:var(--soft);object-fit:contain}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-weight:600;font-size:15px}
.row .info span{color:var(--muted);font-size:13px}
.qty{display:flex;align-items:center;gap:10px;font-weight:600}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--soft);font-size:17px;line-height:1}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:600;margin:18px 0}
.cart .btn-primary{width:100%;justify-content:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<section class="hero">
  <div class="top">
    <div class="logo"><i></i>Price Apple</div>
    <button class="icon-btn" id="openCart" aria-label="Кошик">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12.5H6.2L5 8z"/><path d="M8.5 11V6.5a3.5 3.5 0 0 1 7 0V11"/></svg>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>

</section>

<section class="catalog" id="catalog">

    </label>
  </div>
  <div class="grid" id="grid"></div>
  <p class="credit" id="credit" hidden>3D-модель «AirPods Max 2» — rashed_mahfuz, <a href="https://sketchfab.com/3d-models/airpods-max-2-4a121bf5a6904e9ea4baf7a41d037d4e" target="_blank" rel="noopener">CC BY 4.0</a></p>
</section>

<div class="sheet" id="sheet" hidden>
  <button class="icon-btn close" id="close" aria-label="Закрити">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="gallery" id="gal"></div>
  <div class="dots" id="dots"></div>
  <div class="sheet-body">
    <div class="eyebrow" id="dTag"></div>
    <h2 id="dName"></h2>
    <div class="d-price"><span id="dPrice"></span><s id="dOld"></s></div>
    <div class="colors" id="dColors"></div>
    <div class="color-name" id="dColor"></div>
    <p id="dDesc"></p>
    <ul class="specs" id="dSpecs"></ul>
  </div>
  <div class="bar">
    <button class="like" id="dLike" aria-label="До обраного"></button>
    <button class="btn-primary" id="dCart">У кошик</button>
  </div>
</div>

<button class="cartbar" id="cartbar" hidden><span>Кошик</span><span id="cartsum"></span></button>

<div class="cart" id="cart" hidden>
  <div class="cart-panel">
    <div class="grab"></div>
    <h3>Кошик</h3>
    <div id="cartList"></div>
    <div class="total"><span>Разом</span><span id="cartTotal"></span></div>
    <button class="btn-primary" id="checkout">Оформити замовлення</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
try { tg.ready(); tg.expand(); tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#ffffff'); } catch {}
const haptic = (t = 'light') => tg?.HapticFeedback?.impactOccurred(t);
const $ = id => document.getElementById(id);
const uah = n => n.toLocaleString('uk-UA') + ' ₴';
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>';

// ---------- data (demo) ----------
const MAX = { tag: 'AirPods Max 2', desc: 'Люкс-копія 1:1: алюмінієві чашки, сітчасте оголів’я, м’які амбушури з пам’яттю форми. Глибокий бас, чисті верхи й тиша довкола, коли це потрібно.',
  specs: ['Активне шумозаглушення та режим прозорості', 'Просторове аудіо з відстеженням голови', 'Коліщатко Digital Crown', 'До 20 годин роботи', 'Заряджання USB‑C, чохол Smart Case у комплекті'] };
const PRO = { tag: 'AirPods Pro', desc: 'Люкс-копія 1:1 з активним шумозаглушенням. Анімація підключення на iPhone, датчик вуха, сенсорне керування гучністю.',
  specs: ['Активне шумозаглушення', 'Режим прозорості', 'Сенсорне керування', 'До 6 год + 24 год із кейсом', 'Бездротове заряджання, USB‑C'] };
const AIR = { tag: 'AirPods', desc: 'Люкс-копія 1:1 у легкому відкритому форм-факторі. Зручна посадка без амбушур, швидке підключення, компактний кейс.',
  specs: ['Відкрита посадка', 'Спливаюче вікно підключення', 'Сенсорне керування', 'До 5 год + 30 год із кейсом', 'Заряджання USB‑C'] };

const products = [
  { id: 'max-mid', cat: 'max', group: 'max', name: 'AirPods Max 2', color: 'Темна ніч', hex: '#2e3036', price: 3999, old: 5499, model: { type: 'max', body: 0x33363d, knit: 0x26272b, pad: 0x3a3c42 }, ...MAX },
  { id: 'max-star', cat: 'max', group: 'max', name: 'AirPods Max 2', color: 'Сяйво зорі', hex: '#e9e4da', price: 3999, old: 5499, model: { type: 'max', body: 0xe6e1d7, knit: 0xf2eee7, pad: 0xefebe4 }, ...MAX },
  { id: 'max-blue', cat: 'max', group: 'max', name: 'AirPods Max 2', color: 'Синій', hex: '#a7b8cb', price: 3999, old: 5499, model: { type: 'max', body: 0x93a7bf, knit: 0xb9c7d7, pad: 0xb3c1d2 }, ...MAX },
  { id: 'max-purple', cat: 'max', group: 'max', name: 'AirPods Max 2', color: 'Фіолетовий', hex: '#bfaecf', price: 4199, old: 5499, model: { type: 'max', body: 0xae9cc4, knit: 0xcbbfd9, pad: 0xc6b9d6 }, ...MAX },
  { id: 'max-orange', cat: 'max', group: 'max', name: 'AirPods Max 2', color: 'Помаранчевий', hex: '#eeae86', price: 4199, old: 5499, model: { type: 'max', body: 0xe59f74, knit: 0xf1c3a5, pad: 0xefbd9c }, ...MAX },
  { id: 'pro3', cat: 'pro', group: 'pro3', name: 'AirPods Pro 3', color: 'Білий', hex: '#f5f5f3', price: 1999, old: 2799, model: { type: 'case', w: 1.15, h: .86, r: .3 }, ...PRO },
  { id: 'pro2', cat: 'pro', group: 'pro2', name: 'AirPods Pro 2', color: 'Білий', hex: '#f5f5f3', price: 1599, old: 2299, model: { type: 'case', w: 1.1, h: .84, r: .28 }, ...PRO },
  { id: 'air4anc', cat: 'air', group: 'air4anc', name: 'AirPods 4 ANC', color: 'Білий', hex: '#f5f5f3', price: 1499, old: 1999, model: { type: 'case', w: .98, h: .92, r: .34 }, ...AIR, specs: ['Активне шумозаглушення', ...AIR.specs.slice(1)] },
  { id: 'air4', cat: 'air', group: 'air4', name: 'AirPods 4', color: 'Білий', hex: '#f5f5f3', price: 1199, old: 1699, model: { type: 'case', w: .98, h: .92, r: .34 }, ...AIR },
];
const byId = Object.fromEntries(products.map(p => [p.id, p]));

// ---------- state ----------
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const likes = new Set(load('pa-likes', []));
const cart = new Map(load('pa-cart', []));
let cat = 'all', cur = null;

// ---------- 3D models ----------
const has3D = !!window.THREE;
function rr(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function slab(w, h, r, d, b) {
  const g = new THREE.ExtrudeGeometry(rr(w, h, r), { depth: d, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 8, curveSegments: 32 });
  g.center(); return g;
}
const mat = (color, o) => new THREE.MeshStandardMaterial({ color, roughness: .35, metalness: .25, ...o });

function makeMax(m) {
  const g = new THREE.Group(), inner = new THREE.Group();
  const alu = mat(m.body, { metalness: .4, roughness: .3 }), knit = mat(m.knit, { roughness: .95, metalness: 0, side: THREE.DoubleSide });
  const steel = mat(0xdcdde0, { metalness: .85, roughness: .2 }), pad = mat(m.pad, { roughness: 1, metalness: 0 });
  const cupG = slab(.9, 1.1, .36, .36, .08); cupG.rotateY(Math.PI / 2);
  const padG = slab(.84, 1.04, .34, .2, .07); padG.rotateY(Math.PI / 2);
  const stemG = new THREE.CylinderGeometry(.034, .034, .44, 16);
  const joinG = new THREE.CylinderGeometry(.045, .045, .46, 16); joinG.rotateX(Math.PI / 2);
  for (const s of [-1, 1]) {
    const cup = new THREE.Mesh(cupG, alu); cup.position.x = s * 1.08; inner.add(cup);
    const p = new THREE.Mesh(padG, pad); p.position.x = s * .74; inner.add(p);
    const stem = new THREE.Mesh(stemG, steel); stem.position.set(s * 1.08, .84, 0); inner.add(stem);
    const join = new THREE.Mesh(joinG, steel); join.position.set(s * 1.08, 1.05, 0); inner.add(join);
  }
  for (const z of [-.22, .22]) {
    const rail = new THREE.Mesh(new THREE.TorusGeometry(1.08, .028, 12, 96, Math.PI), steel); rail.position.set(0, 1.05, z); inner.add(rail);
  }
  const canopyG = new THREE.CylinderGeometry(1.0, 1.0, .42, 80, 1, true, Math.PI - 1.2, 2.4); canopyG.rotateX(Math.PI / 2);
  const canopy = new THREE.Mesh(canopyG, knit); canopy.position.y = 1.05; inner.add(canopy);
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(.075, .075, .09, 32), steel); crown.position.set(1.08, .7, .2); inner.add(crown);
  const btn = new THREE.Mesh(new THREE.BoxGeometry(.07, .05, .18), alu); btn.position.set(1.08, .68, -.14); inner.add(btn);
  inner.position.y = -.75; g.add(inner); return g;
}
function makeCase(m) {
  const g = new THREE.Group(), inner = new THREE.Group();
  inner.add(new THREE.Mesh(slab(m.w, m.h, m.r, .32, .12), mat(0xdcdcdc, { roughness: .3, metalness: .05 })));
  const seam = new THREE.Mesh(new THREE.BoxGeometry(m.w + .25, .018, .575), mat(0x8e8e94, { roughness: .6, metalness: 0 }));
  seam.position.y = m.h * .2; inner.add(seam);
  const led = new THREE.Mesh(new THREE.SphereGeometry(.025, 16, 16), mat(0x9ad7a0, { emissive: 0x3c8f48, emissiveIntensity: .6 }));
  led.position.set(0, -.08, .285); inner.add(led);
  inner.scale.setScalar(1.75); g.add(inner); return g;
}
const makeModel = m => m.type === 'max' ? makeMax(m) : makeCase(m);
function makeScene() {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0xcfcfd6, .75));
  const key = new THREE.DirectionalLight(0xffffff, .85); key.position.set(3, 5, 6); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, .45); rim.position.set(-5, 2, -4); scene.add(rim);
  const low = new THREE.DirectionalLight(0xffffff, .25); low.position.set(0, -4, 3); scene.add(low);
  return scene;
}

// Offscreen renders = product "photos". shortcut: generated from the 3D models, swap img src for real photos when you have them.
let shotR, shotCam;
const shots = {};
function shotsFor(p, n = 4) {
  if (!has3D) return [];
  if (shots[p.id]?.length >= n) return shots[p.id].slice(0, n);
  if (!shotR) {
    shotR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    shotR.setPixelRatio(1); shotR.setSize(640, 640, false);
    shotCam = new THREE.PerspectiveCamera(28, 1, .1, 50); shotCam.position.set(0, .6, 8.2); shotCam.lookAt(0, 0, 0);
  }
  const scene = makeScene(), model = makeModel(p.model); scene.add(model);
  const angles = p.model.type === 'max' ? [.55, -.75, 2.5, 0] : [.35, -.55, 1.15, 0];
  shots[p.id] = angles.slice(0, n).map(a => {
    model.rotation.set(.12, a, 0); shotR.render(scene, shotCam);
    return shotR.domElement.toDataURL('image/webp', .9);
  });
  model.traverse(o => o.geometry?.dispose());
  return shots[p.id];
}

// ---------- hero ----------
function initHero() {
  const canvas = $('hero3d');
  if (!has3D) return;
  const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  r.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  const cam = new THREE.PerspectiveCamera(28, 1, .1, 50); cam.position.set(0, .5, 8.4); cam.lookAt(0, 0, 0);
  const scene = makeScene(); let model = makeMax(products[0].model); scene.add(model);
  // Real Sketchfab model if the file is present; otherwise the built-in one stays.
  THREE.GLTFLoader && new THREE.GLTFLoader().load('models/airpods-max-2.glb', gltf => {
    const m = gltf.scene, box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3());
    m.position.sub(box.getCenter(new THREE.Vector3()));
    const holder = new THREE.Group(); holder.add(m); holder.scale.setScalar(2.9 / Math.max(size.x, size.y, size.z));
    scene.remove(model); model = holder; scene.add(model);
    r.outputEncoding = THREE.sRGBEncoding; // GLB textures are sRGB
    $('credit').hidden = false;
  }, undefined, () => {});
  const fit = () => { const { clientWidth: w, clientHeight: h } = canvas; r.setSize(w, h, false); cam.aspect = w / h; cam.position.z = Math.max(7.6, 7.6 / cam.aspect); cam.updateProjectionMatrix(); };
  new ResizeObserver(fit).observe(canvas);
  let spin = .5, drag = null, last = performance.now(), onScreen = true;
  new IntersectionObserver(([e]) => onScreen = e.isIntersecting).observe(canvas);
  canvas.addEventListener('pointerdown', e => { drag = e.clientX; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (drag === null) return; spin = (e.clientX - drag) * .25; drag = e.clientX; });
  canvas.addEventListener('pointerup', () => drag = null);
  const loop = t => {
    requestAnimationFrame(loop);
    // skip GPU work while the hero is scrolled away or a sheet covers it
    if (!onScreen || document.body.classList.contains('lock')) { last = t; return; }
    const dt = Math.min((t - last) / 1000, .05); last = t;
    if (drag === null) spin += (.5 - spin) * .03; // ease back to idle speed after a flick
    model.rotation.y += spin * dt;
    model.rotation.x = .12 + Math.sin(t / 1600) * .05;
    model.position.y = Math.sin(t / 1100) * .08;
    r.render(scene, cam);
  };
  requestAnimationFrame(loop);
}

// ---------- catalog ----------
function renderGrid() {
  const q = $('q').value.trim().toLowerCase(), sort = $('sort').value;
  const list = products.filter(p => (cat === 'all' || p.cat === cat || (cat === 'fav' && likes.has(p.id)))
    && `${p.name} ${p.color}`.toLowerCase().includes(q));
  if (sort !== 'pop') list.sort((a, b) => sort === 'asc' ? a.price - b.price : b.price - a.price);
  $('count').textContent = `Товарів: ${list.length}`;
  $('grid').innerHTML = list.map((p, i) => `
    <article class="card" data-id="${p.id}" style="animation-delay:${i * 40}ms">
      <div class="card-img"><img src="${shotsFor(p, 1)[0] || ''}" alt="${p.name}">
        <button class="like ${likes.has(p.id) ? 'on' : ''}" data-like aria-label="До обраного">${HEART}</button></div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-sub"><i class="sw" style="background:${p.hex}"></i>${p.color}</div>
        <div class="card-price">${uah(p.price)}<s>${uah(p.old)}</s></div>
      </div>
    </article>`).join('') || `<p class="empty">${cat === 'fav' ? 'Поки нічого не додано до обраного' : 'Нічого не знайдено'}</p>`;
}

function toggleLike(id) {
  likes.has(id) ? likes.delete(id) : likes.add(id);
  save('pa-likes', [...likes]); haptic('light');
}

$('grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  if (e.target.closest('[data-like]')) {
    toggleLike(card.dataset.id);
    e.target.closest('[data-like]').classList.toggle('on', likes.has(card.dataset.id));
    if (cat === 'fav') renderGrid();
    return;
  }
  openSheet(card.dataset.id, card);
});
$('filters').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = b.dataset.cat; haptic('soft');
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
  renderGrid();
});
$('q').addEventListener('input', renderGrid);
$('sort').addEventListener('change', renderGrid);
document.querySelectorAll('[data-scroll]').forEach(b => b.onclick = () => $('catalog').scrollIntoView({ behavior: 'smooth' }));

// ---------- product sheet ----------
function fillSheet(p) {
  cur = p;
  const imgs = shotsFor(p);
  $('gal').innerHTML = imgs.map(s => `<img src="${s}" alt="${p.name}">`).join('');
  $('gal').scrollLeft = 0;
  $('dots').innerHTML = imgs.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('');
  $('dTag').textContent = p.tag; $('dName').textContent = p.name;
  $('dPrice').textContent = uah(p.price); $('dOld').textContent = uah(p.old);
  const variants = products.filter(v => v.group === p.group);
  $('dColors').innerHTML = variants.length > 1 ? variants.map(v => `<button class="${v === p ? 'on' : ''}" data-v="${v.id}" style="background:${v.hex}" aria-label="${v.color}"></button>`).join('') : '';
  $('dColor').textContent = 'Колір: ' + p.color;
  $('dDesc').textContent = p.desc;
  $('dSpecs').innerHTML = p.specs.map(s => `<li>${s}</li>`).join('');
  $('dLike').innerHTML = HEART; $('dLike').classList.toggle('on', likes.has(p.id));
  updateCartBtn();
}
const EASE = 'cubic-bezier(.2,.8,.2,1)';
const motion = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1;
// Sheet shrunk into the card: gallery photo (square, top) lands exactly on the card photo.
function cardFrame(card) {
  const r = card.getBoundingClientRect(), k = r.width / innerWidth;
  return { transform: `translate(${r.left}px, ${r.top}px) scale(${k})`,
    clipPath: `inset(0px 0px ${Math.max(0, innerHeight - r.height / k)}px 0px round ${24 / k}px)` };
}
const FULL = { transform: 'translate(0px, 0px) scale(1)', clipPath: 'inset(0px 0px 0px 0px round 0px)' };
const chrome = () => [$('sheet').querySelector('.sheet-body'), $('sheet').querySelector('.bar'), $('close')];
let busy = false;

function openSheet(id, card) {
  if (busy) return;
  fillSheet(byId[id]); haptic('medium');
  const sheet = $('sheet');
  sheet.hidden = false; sheet.scrollTop = 0; syncChrome();
  busy = true;
  sheet.animate([{ ...cardFrame(card), opacity: 0 }, { opacity: 1, offset: .15 }, { ...FULL, opacity: 1 }],
    { duration: 520 * motion(), easing: EASE });
  setTimeout(() => busy = false, 520 * motion()); // timer, not onfinish: paused animations (app in background) must not lock the UI
  chrome().forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }],
    { duration: 380 * motion(), delay: (200 + i * 40) * motion(), easing: EASE, fill: 'backwards' }));
}
function closeSheet() {
  if (busy) return;
  const sheet = $('sheet'), card = document.querySelector(`.card[data-id="${cur.id}"]`);
  const r = card?.getBoundingClientRect();
  // shrink back only when the card is on screen and the photo is still at the top; otherwise just fade
  const shrink = r && r.bottom > 0 && r.top < innerHeight && sheet.scrollTop < 40;
  busy = true;
  chrome().forEach(el => el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150 * motion(), fill: 'forwards' }));
  const frames = shrink
    ? [{ ...FULL, opacity: 1 }, { opacity: 1, offset: .8 }, { ...cardFrame(card), opacity: 0 }]
    : [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.96)' }];
  sheet.animate(frames, { duration: 420 * motion(), easing: 'cubic-bezier(.3,0,.2,1)', fill: 'forwards' });
  setTimeout(() => {
    sheet.hidden = true; busy = false; syncChrome(); renderCardLike();
    sheet.getAnimations({ subtree: true }).forEach(a => a.cancel()); // drop the fill:'forwards' fades
  }, 420 * motion());
}
function renderCardLike() {
  document.querySelectorAll('.card').forEach(c => c.querySelector('[data-like]').classList.toggle('on', likes.has(c.dataset.id)));
}
$('close').onclick = closeSheet;
$('dColors').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { haptic('soft'); fillSheet(byId[b.dataset.v]); } });
$('gal').addEventListener('scroll', () => {
  const i = Math.round($('gal').scrollLeft / $('gal').clientWidth);
  [...$('dots').children].forEach((d, j) => d.classList.toggle('on', i === j));
}, { passive: true });
$('dLike').onclick = () => { toggleLike(cur.id); $('dLike').classList.toggle('on', likes.has(cur.id)); };
$('dCart').onclick = () => { cart.set(cur.id, (cart.get(cur.id) || 0) + 1); haptic('medium'); updateCart(); };
function updateCartBtn() {
  const n = cart.get(cur?.id);
  $('dCart').textContent = n ? `У кошику · ${n}` : `У кошик · ${uah(cur.price)}`;
}

// ---------- cart ----------
function updateCart() {
  save('pa-cart', [...cart]);
  const count = [...cart.values()].reduce((a, b) => a + b, 0);
  const total = [...cart].reduce((s, [id, n]) => s + byId[id].price * n, 0);
  $('badge').textContent = count || '';
  $('cartsum').textContent = `${count} шт · ${uah(total)}`;
  $('cartTotal').textContent = uah(total);
  $('cartList').innerHTML = [...cart].map(([id, n]) => { const p = byId[id]; return `
    <div class="row"><img src="${shotsFor(p, 1)[0] || ''}" alt="">
      <div class="info"><b>${p.name}</b><span>${p.color} · ${uah(p.price)}</span></div>
      <div class="qty"><button data-dec="${id}" aria-label="Менше">−</button>${n}<button data-inc="${id}" aria-label="Більше">+</button></div></div>`; }).join('')
    || '<p class="empty">Кошик порожній</p>';
  $('checkout').hidden = !count;
  if (cur) updateCartBtn();
  syncChrome();
}
$('cartList').addEventListener('click', e => {
  const inc = e.target.dataset.inc, dec = e.target.dataset.dec, id = inc || dec; if (!id) return;
  const n = (cart.get(id) || 0) + (inc ? 1 : -1);
  n > 0 ? cart.set(id, n) : cart.delete(id); haptic('light'); updateCart();
});
const openCart = () => { $('cart').hidden = false; syncChrome(); };
const closeCart = () => { $('cart').hidden = true; syncChrome(); };
$('openCart').onclick = openCart; $('cartbar').onclick = openCart;
$('cart').addEventListener('click', e => { if (e.target === $('cart')) closeCart(); });
$('checkout').onclick = () => {
  const msg = 'Демо-версія: замовлення буде передано менеджеру Price Apple.';
  tg?.initData ? tg.showAlert(msg) : alert(msg); // outside Telegram showAlert throws
};

// One place that keeps scroll lock, cart bar and Telegram back button in sync with what's open.
function syncChrome() {
  const sheet = !$('sheet').hidden, cartOpen = !$('cart').hidden;
  document.body.classList.toggle('lock', sheet || cartOpen);
  $('cartbar').hidden = !cart.size || sheet || cartOpen;
  if (tg?.BackButton) (sheet || cartOpen) ? tg.BackButton.show() : tg.BackButton.hide();
}
tg?.BackButton?.onClick(() => !$('cart').hidden ? closeCart() : closeSheet());

initHero();
// let the hero paint first; card pictures are rendered right after
setTimeout(() => { renderGrid(); updateCart(); }, 60);
</script>
